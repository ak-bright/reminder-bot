[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reminderbot"
version = "0.1.0"
description = "A Telegram bot that makes sure students never miss a deadline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.0,<23",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "tzdata>=2024.1", # timezone database (needed on Windows)
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20", # async SQLite driver (development)
    "alembic>=1.13",
    "anthropic>=2.11,<3",
    "dateparser>=1.2", # only a second opinion on the dates the AI finds
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
reminderbot = "reminderbot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reminderbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["reminderbot", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
